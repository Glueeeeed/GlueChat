appId: com.gluechat.app
productName: gluechat
directories:
  buildResources: build

files:
  - "**/*"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "node_modules/**/*.node"

asarUnpack:
  - "**/*.node"

win:
  icon: build/icon.ico
  executableName: gluechat
  target:
    - nsis

linux:
  icon: icon.png
  syncDesktopName: true
  target:
    - AppImage
    - deb
    - rpm
  category: Utility
