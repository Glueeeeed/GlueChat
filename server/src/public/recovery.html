<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GlueChat | Account Recovery</title>
    <link rel="stylesheet" href="/api/auth/output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
</head>
<body>
<div class="w-full h-full flex items-center justify-center flex-col">
    <div class='mt-10'>
        <h1 class='text-center text-6xl mt-5 mb-5 font-["Pacifico"] text-[#eff1ed]'>
            GlueChat
        </h1>
        <p class="text-white opacity-60 text-[10px] uppercase tracking-[0.4em] font-medium mt-10 text-center max-w-md">
            Post-Quantum • End-to-End Encrypted Messenger
        </p>
    </div>

    <div class="mt-10 bg-gray-900/60 backdrop-blur-xl p-8 rounded-3xl shadow-[0_0_50px_-12px_rgba(0,0,0,0.5)] w-full max-w-md mx-auto border border-white/10">
        <h2 class="text-2xl font-black mb-8 text-center text-white uppercase tracking-wider">
            Password Reset
        </h2>


            <div class="mb-6">
                <label class="block text-gray-500 text-xs uppercase tracking-widest font-bold mb-2 ml-1">
                    Enter your new password
                </label>
                <input  required class="bg-gray-950/50 border border-white/5 text-white text-base rounded-xl focus:ring-2 focus:ring-violet-500/30 focus:border-violet-500/50 block w-full p-3.5 outline-none transition-all placeholder-gray-600 shadow-inner" placeholder="Enter your password" id="password" type="text"/>
            </div>

            <div class="mb-6">
                <label class="block text-gray-500 text-xs uppercase tracking-widest font-bold mb-2 ml-1">
                    Repeat your new password
                </label>
                <input  required class="bg-gray-950/50 border border-white/5 text-white text-base rounded-xl focus:ring-2 focus:ring-violet-500/30 focus:border-violet-500/50 block w-full p-3.5 outline-none transition-all placeholder-gray-600 shadow-inner" placeholder="Enter your password" id="repeatPassword" type="text"/>
            </div>


        <button onClick="changePassword()" class="bg-violet-600 hover:bg-violet-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold py-2.5 px-4 rounded-lg focus:outline-none focus:ring-4 focus:ring-violet-500/30 w-full transition-all cursor-pointer" type="submit">
            Reset password
        </button>
    </div>
</div>
<script src="/api/auth/main.js"></script>
</body>
</html>
